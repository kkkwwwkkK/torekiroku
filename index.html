<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORKOUT LOG</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0b0d10;
  --card: #15181d;
  --card2: #1c2026;
  --text: #f5f5f5;
  --muted: #9299a3;
  --line: #2b3038;
  --accent: #ffffff;
  --danger: #ff5d5d;
  --success: #55d98b;
  --warning: #ffd166;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 760px;
  margin: 0 auto;
  padding-bottom: 90px;
}

header {
  padding: 24px 18px 14px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.page {
  display: none;
  padding: 10px 16px;
}

.page.active {
  display: block;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  min-width: 0;
  height: 44px;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  padding: 0 12px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #666;
}

/* 日付欄のはみ出し対策 */
.date-input {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  appearance: none;
  -webkit-appearance: none;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

@media(max-width: 430px) {
  .grid2 {
    grid-template-columns: 1fr;
  }
}

.body-buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.body-btn {
  background: var(--card2);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 9px;
  padding: 10px 4px;
  font-size: 12px;
}

.body-btn.active {
  background: var(--text);
  color: #111;
  border-color: var(--text);
}

.exercise-card {
  background: var(--card2);
  border-radius: 13px;
  padding: 13px;
  margin-top: 12px;
  border: 1px solid var(--line);
}

.exercise-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.exercise-name {
  font-weight: 800;
  font-size: 15px;
}

.remove-btn {
  background: transparent;
  border: none;
  color: var(--danger);
  font-size: 12px;
}

.set-row {
  display: grid;
  grid-template-columns: 36px 1fr 1fr 32px;
  gap: 6px;
  align-items: center;
  margin-top: 8px;
}

.set-number {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.small-input {
  height: 38px;
  padding: 0 8px;
  font-size: 13px;
}

.delete-set {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 18px;
}

.add-set,
.add-exercise,
.primary-btn,
.secondary-btn,
.danger-btn {
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 11px 14px;
  font-weight: 700;
}

.add-set {
  margin-top: 10px;
  width: 100%;
  background: transparent;
  color: var(--text);
}

.add-exercise {
  width: 100%;
  margin-top: 12px;
  background: transparent;
  color: var(--text);
}

.primary-btn {
  width: 100%;
  background: var(--text);
  color: #111;
  border-color: var(--text);
  margin-top: 12px;
}

.secondary-btn {
  background: var(--card2);
  color: var(--text);
}

.danger-btn {
  background: transparent;
  color: var(--danger);
  border-color: #572b2b;
}

.previous-box {
  margin-top: 10px;
  background: #111418;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  font-size: 12px;
}

.previous-label {
  color: var(--muted);
  margin-bottom: 4px;
}

.previous-value {
  font-weight: 800;
}

.growth {
  margin-top: 5px;
  font-weight: 800;
}

.growth.up {
  color: var(--success);
}

.growth.same {
  color: var(--warning);
}

.growth.down {
  color: var(--danger);
}

.total-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card2);
  border-radius: 12px;
  padding: 13px;
  margin-top: 12px;
}

.total-label {
  color: var(--muted);
  font-size: 12px;
}

.total-value {
  font-size: 20px;
  font-weight: 900;
}

nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: 760px;
  background: rgba(15,17,21,.96);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 100;
}

nav button {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 12px 4px 10px;
  font-size: 11px;
}

nav button.active {
  color: var(--text);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}

.stat {
  background: var(--card2);
  border-radius: 12px;
  padding: 12px;
}

.stat-value {
  font-size: 20px;
  font-weight: 900;
}

.stat-label {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}

.progress {
  height: 8px;
  background: #272c33;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 9px;
}

.progress-bar {
  height: 100%;
  background: white;
  width: 0%;
}

.history-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px;
  margin-bottom: 9px;
}

.history-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.history-date {
  font-weight: 800;
}

.history-part {
  color: var(--muted);
  font-size: 12px;
}

.history-exercise {
  margin-top: 10px;
  font-size: 13px;
}

.history-actions {
  display: flex;
  gap: 7px;
  margin-top: 12px;
}

.history-actions button {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: var(--text);
  font-size: 12px;
}

canvas {
  width: 100%;
  height: 230px;
  background: var(--card2);
  border-radius: 12px;
  margin-top: 10px;
}

.level {
  font-size: 28px;
  font-weight: 900;
}

.motivation {
  font-size: 15px;
  line-height: 1.6;
}

.report-preview {
  background: white;
  color: #111;
  padding: 18px;
  border-radius: 10px;
  margin-top: 12px;
}

.report-preview h1 {
  margin: 0;
  font-size: 23px;
}

.report-preview h2 {
  font-size: 15px;
  margin: 15px 0 7px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 4px;
}

.report-summary {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 5px;
}

.report-stat {
  background: #f3f3f3;
  padding: 7px;
  border-radius: 5px;
}

.report-stat strong {
  display: block;
  font-size: 15px;
}

.report-stat span {
  font-size: 8px;
  color: #666;
}

.report-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 8px;
}

.report-table th,
.report-table td {
  border-bottom: 1px solid #ddd;
  padding: 3px;
  text-align: left;
}

.report-growth {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 5px;
}

.growth-item {
  background: #f3f3f3;
  padding: 7px;
  border-radius: 5px;
  font-size: 9px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 650px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
}

.modal-title {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 15px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.modal-actions button {
  flex: 1;
}

.empty {
  color: var(--muted);
  text-align: center;
  padding: 30px 10px;
  font-size: 13px;
}

.pr {
  color: var(--warning);
  font-weight: 900;
}

.notice {
  padding: 12px;
  border-radius: 10px;
  background: #17241c;
  border: 1px solid #294d37;
  color: var(--success);
  margin-bottom: 12px;
  font-size: 13px;
}

/* PDF用 */
#printReport {
  display: none;
}

@media print {
  body {
    background: white !important;
    color: black !important;
  }

  body > * {
    display: none !important;
  }

  #printReport {
    display: block !important;
    width: 210mm;
    height: 297mm;
    padding: 10mm;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
  }

  .print-title {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 3px;
  }

  .print-subtitle {
    font-size: 9px;
    color: #666;
  }

  .print-summary {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 4px;
    margin: 10px 0;
  }

  .print-stat {
    border: 1px solid #ddd;
    padding: 5px;
  }

  .print-stat strong {
    display: block;
    font-size: 13px;
  }

  .print-stat span {
    font-size: 8px;
    color: #666;
  }

  .print-section-title {
    font-size: 12px;
    font-weight: 900;
    border-bottom: 1px solid #111;
    padding-bottom: 3px;
    margin-top: 8px;
    margin-bottom: 4px;
  }

  .print-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 7px;
  }

  .print-table th,
  .print-table td {
    border-bottom: 1px solid #ddd;
    padding: 2px 3px;
    text-align: left;
  }

  .print-growth-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 4px;
  }

  .print-growth {
    border: 1px solid #ddd;
    padding: 5px;
    font-size: 8px;
  }

  .print-growth strong {
    display: block;
    font-size: 11px;
  }

  .print-chart {
    width: 100%;
    height: 85mm;
    margin-top: 5px;
    border: 1px solid #ddd;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">WORKOUT LOG</div>
  <div class="subtitle">TRAIN. RECORD. GROW.</div>
</header>

<!-- HOME -->
<section id="homePage" class="page active">

  <div class="card">
    <div class="card-title">今週のトレーニング</div>

    <div class="stat-grid">
      <div class="stat">
        <div class="stat-value" id="weekCount">0</div>
        <div class="stat-label">今週</div>
      </div>

      <div class="stat">
        <div class="stat-value" id="weekGoal">3</div>
        <div class="stat-label">目標</div>
      </div>

      <div class="stat">
        <div class="stat-value" id="streak">0</div>
        <div class="stat-label">連続日数</div>
      </div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="weekProgress"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">現在のレベル</div>
    <div class="level" id="levelText">Lv.1</div>
    <div class="subtitle" id="levelDetail">トレーニングを記録してレベルアップ</div>
  </div>

  <div class="card">
    <div class="card-title">今日のモチベーション</div>
    <div class="motivation" id="motivationText"></div>
  </div>

  <div class="card">
    <div class="card-title">月間レポート</div>
    <button class="primary-btn" onclick="openReportPage()">
      先月のレポートを見る
    </button>
  </div>

</section>

<!-- RECORD -->
<section id="recordPage" class="page">

  <div class="card">
    <div class="card-title">トレーニング日</div>

    <label>日付</label>
    <input
      id="workoutDate"
      class="date-input"
      type="date"
    >

    <label style="margin-top:12px;">部位</label>

    <div class="body-buttons">
      <button class="body-btn" data-part="胸">胸</button>
      <button class="body-btn" data-part="背中">背中</button>
      <button class="body-btn" data-part="肩">肩</button>
      <button class="body-btn" data-part="腕">腕</button>
      <button class="body-btn" data-part="脚">脚</button>
    </div>
  </div>

  <div class="card">

    <div class="card-title">種目</div>

    <div class="grid2">

      <div>
        <label>やったことのある種目</label>
        <select id="exerciseSelect">
          <option value="">種目を選択</option>
        </select>
      </div>

      <div>
        <label>新しい種目</label>
        <input
          id="newExercise"
          type="text"
          placeholder="例：ベンチプレス"
        >
      </div>

    </div>

    <button class="add-exercise" onclick="addExercise()">
      ＋ 種目を追加
    </button>

    <div id="exerciseList"></div>

    <div class="total-box">
      <div>
        <div class="total-label">今回の総負荷</div>
        <div class="subtitle">重量 × REP の合計</div>
      </div>

      <div class="total-value" id="workoutTotal">0 kg</div>
    </div>

    <button class="primary-btn" onclick="saveWorkout()">
      トレーニングを保存
    </button>

  </div>

</section>

<!-- HISTORY -->
<section id="historyPage" class="page">

  <div class="card">

    <div class="card-title">トレーニング履歴</div>

    <div class="grid2">
      <select id="historyFilter" onchange="renderHistory()">
        <option value="すべて">すべて</option>
        <option value="胸">胸</option>
        <option value="背中">背中</option>
        <option value="肩">肩</option>
        <option value="腕">腕</option>
        <option value="脚">脚</option>
      </select>

      <select id="monthFilter" onchange="renderHistory()">
        <option value="all">全期間</option>
      </select>
    </div>

  </div>

  <div class="card">
    <div class="card-title">成長グラフ</div>
    <canvas id="growthChart"></canvas>
  </div>

  <div id="historyList"></div>

</section>

<!-- REPORT -->
<section id="reportPage" class="page">

  <div class="card">

    <div class="card-title">月間レポート</div>

    <select id="reportMonth" onchange="generateReport()"></select>

    <button class="primary-btn" onclick="printReport()">
      A4・1ページでPDF出力
    </button>

  </div>

  <div id="reportPreview"></div>

</section>

<!-- DATA -->
<section id="dataPage" class="page">

  <div class="card">

    <div class="card-title">データ管理</div>

    <button class="primary-btn" onclick="exportBackup()">
      JSONバックアップを保存
    </button>

    <label style="margin-top:14px;">バックアップから復元</label>

    <input
      type="file"
      id="backupFile"
      accept=".json,application/json"
      onchange="importBackup(event)"
    >

    <button
      class="danger-btn"
      style="width:100%;margin-top:15px;"
      onclick="resetAllData()"
    >
      全データを削除
    </button>

  </div>

</section>

</div>

<nav>
  <button class="active" data-page="homePage">
    ホーム
  </button>

  <button data-page="recordPage">
    記録
  </button>

  <button data-page="historyPage">
    履歴
  </button>

  <button data-page="reportPage">
    レポート
  </button>

  <button data-page="dataPage">
    データ
  </button>
</nav>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">

  <div class="modal-box">

    <div class="modal-title">記録を編集</div>

    <input type="hidden" id="editId">

    <label>日付</label>
    <input id="editDate" type="date">

    <label style="margin-top:10px;">部位</label>
    <select id="editPart">
      <option value="胸">胸</option>
      <option value="背中">背中</option>
      <option value="肩">肩</option>
      <option value="腕">腕</option>
      <option value="脚">脚</option>
    </select>

    <div id="editExercises"></div>

    <button class="add-exercise" onclick="addEditExercise()">
      ＋ 種目を追加
    </button>

    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeEdit()">
        キャンセル
      </button>

      <button class="primary-btn" onclick="saveEdit()">
        保存
      </button>
    </div>

  </div>

</div>

<!-- MONTHLY REPORT AUTO MODAL -->
<div class="modal" id="reportModal">

  <div class="modal-box">

    <div class="modal-title">
      📊 先月のトレーニングレポート
    </div>

    <div id="reportModalText"></div>

    <div class="modal-actions">

      <button
        class="secondary-btn"
        onclick="closeReportModal()"
      >
        あとで
      </button>

      <button
        class="primary-btn"
        onclick="openReportFromModal()"
      >
        レポートを見る
      </button>

    </div>

  </div>

</div>

<!-- PRINT AREA -->
<div id="printReport"></div>

<script>

/* =========================
   DATA
========================= */

const STORAGE_KEY = "workoutLog_v3";

let data = {
  workouts: [],
  exercises: [],
  settings: {
    weeklyGoal: 3
  },
  reports: {}
};

let currentPart = "胸";
let currentExercises = [];


/* =========================
   LOAD / SAVE
========================= */

function loadData() {

  const saved = localStorage.getItem(STORAGE_KEY);

  if (saved) {
    try {
      data = JSON.parse(saved);
    } catch(e) {
      console.error(e);
    }
  }

  if (!data.workouts) data.workouts = [];
  if (!data.exercises) data.exercises = [];

  if (!data.settings) {
    data.settings = {
      weeklyGoal: 3
    };
  }

  if (!data.reports) {
    data.reports = {};
  }
}

function saveData() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


/* =========================
   INIT
========================= */

loadData();

document.getElementById("workoutDate").value =
  todayString();

document.querySelectorAll(".body-btn")
.forEach(btn => {

  btn.addEventListener("click", () => {

    document.querySelectorAll(".body-btn")
    .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    currentPart = btn.dataset.part;

    updateExerciseSelect();
    updatePreviousDisplays();

  });

});

document.querySelector(".body-btn").classList.add("active");


document.querySelectorAll("nav button")
.forEach(btn => {

  btn.addEventListener("click", () => {

    showPage(btn.dataset.page);

  });

});


updateExerciseSelect();
renderHome();
renderHistory();
populateMonths();
generateReport();
checkMonthlyReport();


/* =========================
   PAGE
========================= */

function showPage(pageId) {

  document.querySelectorAll(".page")
  .forEach(page => page.classList.remove("active"));

  document.getElementById(pageId)
  .classList.add("active");

  document.querySelectorAll("nav button")
  .forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.dataset.page === pageId
    );

  });

  if (pageId === "historyPage") {
    renderHistory();
  }

  if (pageId === "homePage") {
    renderHome();
  }

  if (pageId === "reportPage") {
    generateReport();
  }

}


/* =========================
   DATE
========================= */

function todayString() {

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}


/* =========================
   EXERCISE MASTER
========================= */

function updateExerciseSelect() {

  const select =
    document.getElementById("exerciseSelect");

  const exercises =
    [...new Set(
      data.exercises
    )];

  select.innerHTML =
    `<option value="">種目を選択</option>`;

  exercises.forEach(name => {

    const option =
      document.createElement("option");

    option.value = name;
    option.textContent = name;

    select.appendChild(option);

  });

}


/* =========================
   ADD EXERCISE
========================= */

function addExercise() {

  const select =
    document.getElementById("exerciseSelect");

  const newInput =
    document.getElementById("newExercise");

  let name =
    newInput.value.trim() ||
    select.value;

  if (!name) {

    alert("種目を選択または入力してください。");
    return;

  }

  if (!currentExercises.some(e => e.name === name)) {

    currentExercises.push({

      id: createId(),

      name,

      sets: [

          reps: ""
        }
      ]

    });

  }

    data.exercises.push(name);

/* =========================
   SET CONTROL
========================= */

function updateSet(
  exerciseId,
  setIndex,
  key,
  value
) {

  const exercise =
    currentExercises.find(
      e => e.id === exerciseId
    );

  if (!exercise) return;

  exercise.sets[setIndex][key] =
    value;

  calculateCurrentTotal();
  updateGrowthDisplays();

}


function addSetToExercise(id) {

  const exercise =
    currentExercises.find(
      e => e.id === id
    );

  if (!exercise) return;

  exercise.sets.push({
    weight: "",
    reps: ""
  });

  renderCurrentExercises();

}


function removeSet(id,index) {

  const exercise =
    currentExercises.find(
      e => e.id === id
    );

  if (!exercise) return;

  if (exercise.sets.length <= 1) {

    alert("最低1セットは残してください。");
    return;

  }

  exercise.sets.splice(index,1);

  renderCurrentExercises();

}


function removeCurrentExercise(id) {

  currentExercises =
    currentExercises.filter(
      e => e.id !== id
    );

  renderCurrentExercises();

}


/* =========================
   PREVIOUS RECORD
========================= */

function getPreviousWorkout(
  part,
  date
) {

  return data.workouts

    .filter(w =>
      w.part === part &&
      w.date < date
    )

    .sort((a,b) =>
      b.date.localeCompare(a.date)
    )[0] || null;

}


function getPreviousExerciseRecord(
  part,
  exerciseName,
  date
) {

  const workout =
    getPreviousWorkout(
      part,
      date
    );

  if (!workout) return null;

  return workout.exercises.find(
    e => e.name === exerciseName
  ) || null;

}


/* =========================
   PREVIOUS COMPARISON
========================= */

function getCurrentMaxWeight(exercise) {

  const values =
    exercise.sets
    .map(s => Number(s.weight))
    .filter(v => !isNaN(v) && v > 0);

  return values.length
    ? Math.max(...values)
    : 0;

}


function getPreviousMaxWeight(previous) {

  if (!previous) return 0;

  const values =
    previous.sets
    .map(s => Number(s.weight))
    .filter(v => !isNaN(v) && v > 0);

  return values.length
    ? Math.max(...values)
    : 0;

}


function updateGrowthDisplays() {

  currentExercises.forEach(exercise => {

    const previous =
      getPreviousExerciseRecord(
        currentPart,
        exercise.name,
        document.getElementById("workoutDate").value
      );

    const element =
      document.getElementById(
        `growth-${exercise.id}`
      );

    if (!element || !previous) return;

    const currentWeight =
      getCurrentMaxWeight(exercise);

    const previousWeight =
      getPreviousMaxWeight(previous);

    if (!currentWeight) {

      element.innerHTML =
        "今回の記録を入力してください";

      return;

    }

    const diff =
      currentWeight - previousWeight;

    if (diff > 0) {

      element.className =
        "growth up";

      element.textContent =
        `🔥 前回超え！ +${formatNumber(diff)}kg`;

    } else if (diff === 0) {

      element.className =
        "growth same";

      element.textContent =
        "前回と同じ重量";

    } else {

      element.className =
        "growth down";

      element.textContent =
        `前回より ${formatNumber(Math.abs(diff))}kg`;

    }

  });

}


function updatePreviousDisplays() {

  renderCurrentExercises();

}


/* =========================
   TOTAL
========================= */

function calculateCurrentTotal() {

  let total = 0;

  currentExercises.forEach(exercise => {

    exercise.sets.forEach(set => {

      const weight =
        Number(set.weight) || 0;

      const reps =
        Number(set.reps) || 0;

      total += weight * reps;

    });

  });

  document.getElementById(
    "workoutTotal"
  ).textContent =
    `${formatNumber(total)} kg`;

}


/* =========================
   SAVE WORKOUT
========================= */

function saveWorkout() {

  const date =
    document.getElementById("workoutDate").value;

  if (!date) {

    alert("日付を入力してください。");
    return;

  }

  if (!currentPart) {

    alert("部位を選択してください。");
    return;

  }

  if (!currentExercises.length) {

    alert("種目を1つ以上追加してください。");
    return;

  }

  const exercises =
    currentExercises.map(e => ({

      name: e.name,

      sets: e.sets.map(s => ({

        weight: Number(s.weight) || 0,

        reps: Number(s.reps) || 0

      }))

    }));


  const workout = {

    id: createId(),

    date,

    part: currentPart,

    exercises

  };


  const prNames =
    detectPRs(workout);


  data.workouts.push(workout);

  saveData();


  if (prNames.length) {

    alert(
      "🔥 前回超え！\n\n" +
      prNames.join("\n")
    );

  } else {

    alert("トレーニングを保存しました！");

  }


  currentExercises = [];

  renderCurrentExercises();

  renderHome();

  renderHistory();

}


/* =========================
   PR
========================= */

function detectPRs(workout) {

  const results = [];

  workout.exercises.forEach(exercise => {

    const currentMax =
      getCurrentMaxWeight(exercise);

    if (!currentMax) return;

    const previousMaxes =
      data.workouts
      .filter(w =>
        w.exercises &&
        w.exercises.some(
          e => e.name === exercise.name
        )
      )
      .flatMap(w =>
        w.exercises
        .filter(e =>
          e.name === exercise.name
        )
        .flatMap(e =>
          e.sets.map(s => Number(s.weight) || 0)
        )
      );

    const oldMax =
      previousMaxes.length
        ? Math.max(...previousMaxes)
        : 0;

    if (currentMax > oldMax) {

      results.push(
        `${exercise.name}：${oldMax || "初"} → ${currentMax}kg`
      );

    }

  });

  return results;

}

/* =========================
   GROWTH CHART
========================= */

function drawGrowthChart(workouts) {

  const canvas =
    document.getElementById("growthChart");

  const ctx =
    canvas.getContext("2d");

  const width =
    canvas.clientWidth;

  const height =
    canvas.clientHeight;

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;

  ctx.scale(ratio,ratio);

  ctx.clearRect(0,0,width,height);

  if (!workouts.length) return;


  const sorted =
    [...workouts].sort(
      (a,b) =>
        a.date.localeCompare(b.date)
    );


  const values =
    sorted.map(w =>
      w.exercises.reduce(
        (total,e) =>
          total +
          e.sets.reduce(
            (sum,s) =>
              sum +
              (Number(s.weight)||0) *
              (Number(s.reps)||0),
            0
          ),
        0
      )
    );


  const max =
    Math.max(...values,1);


  const pad = 25;

  ctx.strokeStyle =
    "#555";

  ctx.lineWidth = 1;

  ctx.beginPath();

  ctx.moveTo(pad,pad);

  ctx.lineTo(
    pad,
    height-pad
  );

  ctx.lineTo(
    width-pad,
    height-pad
  );

  ctx.stroke();


  if (values.length === 1) {

    const x =
      width / 2;

    const y =
      height-pad -
      (values[0]/max) *
      (height-pad*2);

    ctx.fillStyle =
      "#fff";

    ctx.beginPath();

    ctx.arc(x,y,5,0,Math.PI*2);

    ctx.fill();

    return;

  }


  ctx.strokeStyle =
    "#fff";

  ctx.lineWidth = 2;

  ctx.beginPath();


  values.forEach((value,index) => {

    const x =
      pad +
      index *
      ((width-pad*2)/(values.length-1));

    const y =
      height-pad -
      (value/max) *
      (height-pad*2);


    if (index === 0) {

      ctx.moveTo(x,y);

    } else {

      ctx.lineTo(x,y);

    }

  });

  ctx.stroke();


  values.forEach((value,index) => {

    const x =
      pad +
      index *
      ((width-pad*2)/(values.length-1));

    const y =
      height-pad -
      (value/max) *
      (height-pad*2);


    ctx.fillStyle =
      "#fff";

    ctx.beginPath();

    ctx.arc(x,y,4,0,Math.PI*2);

    ctx.fill();

  });

}

function renderHome() {

    );

  ).style.width =

    "streak"
  ).textContent =

function calculateStreak() {

  if (!data.workouts.length) return 0;

  const dates =
    [...new Set(
      data.workouts.map(w => w.date)
    )]
    .sort()
    .reverse();


  let streak = 0;

  let current =
    new Date(dates[0]);

  const today =
    new Date(todayString());


  const diffToday =
    Math.floor(
      (today-current) /
      86400000
    );


  if (diffToday > 1) return 0;


  for (let i=0;i<dates.length;i++) {

    if (i === 0) {

      streak = 1;
      continue;

    }

    const previous =
      new Date(dates[i-1]);

    const currentDate =
      new Date(dates[i]);

    const diff =
      Math.round(
        (previous-currentDate) /
        86400000
      );

    if (diff === 1) {

      streak++;

    } else {

      break;

    }

  }

  return streak;

}


/* =========================
   MONTHLY REPORT
========================= */

function getPreviousMonthKey() {

  const d =
    new Date();

  d.setMonth(
    d.getMonth()-1
  );

  return `${d.getFullYear()}-${String(
    d.getMonth()+1
  ).padStart(2,"0")}`;

}


function getMonthWorkouts(monthKey) {

  return data.workouts.filter(
    w => w.date.startsWith(monthKey)
  );

}


function getMonthStats(monthKey) {

  const workouts =
    getMonthWorkouts(monthKey);


  let totalWeight = 0;
  let totalSets = 0;
  let maxWeight = 0;
  const exerciseNames = new Set();


  workouts.forEach(workout => {

    workout.exercises.forEach(exercise => {

      exerciseNames.add(
        exercise.name
      );

      exercise.sets.forEach(set => {

        const weight =
          Number(set.weight)||0;

        const reps =
          Number(set.reps)||0;

        totalWeight +=
          weight * reps;

        totalSets++;

        maxWeight =
          Math.max(
            maxWeight,
            weight
          );

      });

    });

  });


  return {

    workouts,
    totalWeight,
    totalSets,
    maxWeight,
    exerciseCount:
      exerciseNames.size

  };

}


/* =========================
   MONTHLY GROWTH
========================= */

function getMonthlyGrowth(monthKey) {

  const workouts =
    getMonthWorkouts(monthKey);

  const names =
    new Set();

  workouts.forEach(w =>
    w.exercises.forEach(e =>
      names.add(e.name)
    )
  );


  const result = [];


  names.forEach(name => {

    const records = [];


    workouts.forEach(w => {

      w.exercises.forEach(e => {

        if (e.name !== name) return;

        const max =
          Math.max(
            ...e.sets.map(
              s => Number(s.weight)||0
            )
          );

        if (max > 0) {

          records.push({
            date: w.date,
            max
          });

        }

      });

    });


    if (!records.length) return;


    records.sort(
      (a,b) =>
        a.date.localeCompare(b.date)
    );


    const first =
      records[0].max;

    const last =
      records[records.length-1].max;


    result.push({

      name,

      first,

      last,

      diff:
        last-first

    });

  });


  return result
    .sort(
      (a,b) =>
        Math.abs(b.diff) -
        Math.abs(a.diff)
    );

}


/* =========================
   REPORT GENERATION
========================= */

function populateMonths() {

  const months =
    [...new Set(
      data.workouts.map(
        w => w.date.slice(0,7)
      )
    )]
    .sort()
    .reverse();


  const filter =
    document.getElementById(
      "monthFilter"
    );

  filter.innerHTML =
    `<option value="all">全期間</option>`;


  months.forEach(month => {

    const option =
      document.createElement("option");

    option.value = month;

    option.textContent =
      formatMonth(month);

    filter.appendChild(option);

  });


  const reportSelect =
    document.getElementById(
      "reportMonth"
    );

  reportSelect.innerHTML = "";

  months.forEach(month => {

    const option =
      document.createElement("option");

    option.value = month;

    option.textContent =
      formatMonth(month);

    reportSelect.appendChild(option);

  });


  if (!months.length) {

    reportSelect.innerHTML =
      `<option>記録なし</option>`;

  }

}


function generateReport() {

  const select =
    document.getElementById(
      "reportMonth"
    );

  const monthKey =
    select.value;


  if (!monthKey ||
      monthKey === "記録なし") {

    document.getElementById(
      "reportPreview"
    ).innerHTML =
      `<div class="empty">
        まだトレーニング記録がありません。
      </div>`;

    return;

  }


  const stats =
    getMonthStats(monthKey);

  const growth =
    getMonthlyGrowth(monthKey);


  let rows = "";


  stats.workouts
    .sort((a,b) =>
      a.date.localeCompare(b.date)
    )
    .forEach(workout => {

      workout.exercises.forEach(exercise => {

        rows += `
          <tr>
            <td>${formatDateShort(workout.date)}</td>
            <td>${workout.part}</td>
            <td>${escapeHtml(exercise.name)}</td>
            <td>${formatSets(exercise.sets)}</td>
          </tr>
        `;

      });

    });


  let growthHtml = "";


  growth.slice(0,8).forEach(item => {

    const sign =
      item.diff > 0
        ? "+"
        : "";

    growthHtml += `
      <div class="growth-item">
        <strong>${escapeHtml(item.name)}</strong>
        ${item.first}kg → ${item.last}kg
        <br>
        <b>${sign}${formatNumber(item.diff)}kg</b>
      </div>
    `;

  });


  document.getElementById(
    "reportPreview"
  ).innerHTML = `

    <div class="report-preview">

      <h1>
        ${formatMonth(monthKey)}
        WORKOUT REPORT
      </h1>

      <div class="subtitle">
        TRAIN. RECORD. GROW.
      </div>

      <div class="report-summary">

        <div class="report-stat">
          <strong>${stats.workouts.length}</strong>
          <span>トレーニング回数</span>
        </div>

        <div class="report-stat">
          <strong>${stats.totalSets}</strong>
          <span>総セット数</span>
        </div>

        <div class="report-stat">
          <strong>${formatNumber(stats.totalWeight)}</strong>
          <span>総負荷 kg</span>
        </div>

        <div class="report-stat">
          <strong>${stats.exerciseCount}</strong>
          <span>種目数</span>
        </div>

      </div>


      <h2>日別トレーニング記録</h2>

      <table class="report-table">

        <thead>
          <tr>
            <th>日付</th>
            <th>部位</th>
            <th>種目</th>
            <th>重量 × REP × SET</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>


      <h2>今月の成長</h2>

      <div class="report-growth">
        ${growthHtml ||
          "<div>データなし</div>"}
      </div>

    </div>
  `;

}

/* =========================
   AUTO REPORT
========================= */

function checkMonthlyReport() {

  const today =
    new Date();

  if (today.getDate() > 7) return;

  const previousMonth =
    getPreviousMonthKey();

  const workouts =
    getMonthWorkouts(previousMonth);

  if (!workouts.length) return;

  if (data.reports[previousMonth]) {
    return;
  }


  document.getElementById(
    "reportModalText"
  ).innerHTML = `

    <p>
      ${formatMonth(previousMonth)}
      のトレーニング記録が
      ${workouts.length}回あります。
    </p>

    <p>
      A4・1ページの月間レポートに
      まとめることができます。
    </p>

  `;


  document
    .getElementById("reportModal")
    .classList.add("show");

}


function closeReportModal() {

  document
    .getElementById("reportModal")
    .classList.remove("show");

}


function openReportFromModal() {

  const month =
    getPreviousMonthKey();

  closeReportModal();

  showPage("reportPage");

  document.getElementById(
    "reportMonth"
  ).value = month;

  generateReport();

  data.reports[month] = true;

  saveData();

}


function openReportPage() {

  showPage("reportPage");

  const month =
    getPreviousMonthKey();

  const select =
    document.getElementById(
      "reportMonth"
    );

  if (
    [...select.options]
    .some(o => o.value === month)
  ) {

    select.value = month;

  }

  generateReport();

}


/* =========================
   BACKUP
========================= */

function exportBackup() {

  const backup = {

    version: 3,

    exportedAt:
      new Date().toISOString(),

    data

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    `workout-backup-${todayString()}.json`;

  a.click();

  URL.revokeObjectURL(url);

}


function importBackup(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  const reader =
    new FileReader();


  reader.onload = function(e) {

    try {

      const backup =
        JSON.parse(e.target.result);


      const imported =
        backup.data || backup;


      if (
        !imported.workouts ||
        !Array.isArray(
          imported.workouts
        )
      ) {

        throw new Error();

      }


      if (
        !confirm(
          "現在のデータをバックアップデータで置き換えますか？"
        )
      ) {

        return;

      }


      data = imported;

      saveData();

      alert(
        "データを復元しました。"
      );

      location.reload();

    } catch(error) {

      alert(
        "バックアップファイルを読み込めませんでした。"
      );

    }

  };


  reader.readAsText(file);

}


/* =========================
   RESET
========================= */

function resetAllData() {

  const first =
    confirm(
      "本当に全データを削除しますか？"
    );

  if (!first) return;


  const second =
    confirm(
      "この操作は元に戻せません。削除しますか？"
    );

  if (!second) return;


  localStorage.removeItem(
    STORAGE_KEY
  );

  location.reload();

}


/* =========================
   UTIL
========================= */

function createId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }

  return (
    Date.now().toString() +
    Math.random()
      .toString(16)
      .slice(2)
  );

}


function formatSets(sets) {

  return sets
    .map(
      s =>
        `${s.weight}kg × ${s.reps}rep`
    )
    .join(" / ");

}


function formatDate(date) {

  const parts =
    date.split("-");

  return `${parts[0]}/${Number(parts[1])}/${Number(parts[2])}`;

}


function formatDateShort(date) {

  const parts =
    date.split("-");

  return `${Number(parts[1])}/${Number(parts[2])}`;

}


function formatMonth(month) {

  const parts =
    month.split("-");

  return `${parts[0]}年${Number(parts[1])}月`;

}


function formatNumber(num) {

  if (
    Number.isInteger(num)
  ) {

    return num.toLocaleString();

  }

  return num.toLocaleString(
    undefined,
    {
      maximumFractionDigits: 1
    }
  );

}


function escapeHtml(str) {

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(str) {

  return escapeHtml(str);

}
