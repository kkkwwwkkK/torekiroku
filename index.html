<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WORKOUT LOG</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #0f0f10;
    color: #fff;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,15,16,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #2a2a2d;
}

.header-inner {
    max-width: 900px;
    margin: auto;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
}

.nav {
    display: flex;
    gap: 8px;
}

.nav button {
    border: none;
    background: #222225;
    color: #aaa;
    padding: 9px 13px;
    border-radius: 10px;
}

.nav button.active {
    background: #fff;
    color: #111;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 20px 80px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

h1 {
    margin-top: 0;
    font-size: 28px;
}

h2 {
    font-size: 20px;
    margin-top: 30px;
}

.card {
    background: #19191c;
    border: 1px solid #29292d;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
}

.part-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.part-btn {
    border: 1px solid #333;
    background: #222225;
    color: #ddd;
    border-radius: 12px;
    padding: 14px 5px;
    font-weight: bold;
}

.part-btn.active {
    background: #fff;
    color: #111;
}

.date-box {
    margin-top: 18px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #101012;
    color: #fff;
    outline: none;
}

input:focus,
select:focus {
    border-color: #777;
}

.exercise-card {
    background: #111113;
    border: 1px solid #303035;
    border-radius: 14px;
    padding: 16px;
    margin-top: 15px;
}

.exercise-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.exercise-title {
    font-size: 18px;
    font-weight: bold;
}

.delete-exercise {
    background: #29292d;
    color: #ff7777;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
}

.previous {
    background: #18181b;
    border-radius: 10px;
    padding: 10px;
    margin: 12px 0;
    font-size: 13px;
    color: #aaa;
}

.previous strong {
    color: #fff;
}

.set-row {
    display: grid;
    grid-template-columns: 40px 1fr 1fr 40px;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
}

.set-number {
    color: #888;
    text-align: center;
}

.remove-set {
    border: none;
    background: #29292d;
    color: #ff7777;
    border-radius: 8px;
    height: 42px;
}

.add-set {
    width: 100%;
    margin-top: 10px;
    border: 1px dashed #444;
    background: transparent;
    color: #aaa;
    padding: 10px;
    border-radius: 10px;
}

.main-button {
    width: 100%;
    border: none;
    background: #fff;
    color: #111;
    padding: 15px;
    border-radius: 12px;
    font-weight: 800;
    margin-top: 15px;
}

.secondary-button {
    width: 100%;
    border: 1px solid #444;
    background: #222225;
    color: #fff;
    padding: 13px;
    border-radius: 12px;
    font-weight: bold;
    margin-top: 10px;
}

.total-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    color: #111;
    border-radius: 14px;
    padding: 18px;
    margin-top: 20px;
}

.total-label {
    font-size: 13px;
    color: #555;
}

.total-number {
    font-size: 26px;
    font-weight: 900;
}

.history-item {
    background: #19191c;
    border: 1px solid #29292d;
    border-radius: 14px;
    padding: 17px;
    margin-bottom: 12px;
}

.history-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-date {
    font-size: 18px;
    font-weight: bold;
}

.part-tag {
    background: #29292d;
    color: #ddd;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 12px;
}

.exercise-summary {
    margin-top: 12px;
    color: #bbb;
    font-size: 14px;
    line-height: 1.8;
}

.history-total {
    margin-top: 12px;
    font-weight: bold;
}

.history-buttons {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.edit-btn,
.delete-btn {
    flex: 1;
    border: none;
    padding: 10px;
    border-radius: 9px;
}

.edit-btn {
    background: #fff;
    color: #111;
}

.delete-btn {
    background: #29292d;
    color: #ff7777;
}

.chart-container {
    position: relative;
    width: 100%;
    height: 320px;
    background: #111113;
    border-radius: 14px;
    padding: 15px;
    overflow-x: auto;
}

canvas {
    width: 100%;
    height: 100%;
}

.empty {
    text-align: center;
    color: #777;
    padding: 50px 10px;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #19191c;
    border: 1px solid #29292d;
    border-radius: 14px;
    padding: 15px;
}

.stat-label {
    color: #888;
    font-size: 12px;
}

.stat-value {
    font-size: 22px;
    font-weight: 800;
    margin-top: 6px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    background: #19191c;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 20px;
}

.close-modal {
    float: right;
    border: none;
    background: #29292d;
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
}

@media (max-width: 600px) {

    .part-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .header-inner {
        padding: 14px;
    }

    .nav button {
        padding: 8px 10px;
        font-size: 12px;
    }

    .container {
        padding: 20px 14px 60px;
    }

    .stat-grid {
        grid-template-columns: 1fr;
    }

    .set-row {
        grid-template-columns: 30px 1fr 1fr 38px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            WORKOUT LOG
        </div>

        <div class="nav">
            <button id="recordNav" class="active" onclick="showPage('record')">
                記録
            </button>

            <button id="historyNav" onclick="showPage('history')">
                履歴
            </button>
        </div>

    </div>
</header>


<main class="container">

<!-- =========================
     記録ページ
========================= -->

<section id="recordPage" class="page active">

    <h1>トレーニング記録</h1>

    <div class="card">

        <h2>① 今日の部位</h2>

        <div class="part-grid">

            <button class="part-btn active" onclick="selectPart('胸')">
                胸
            </button>

            <button class="part-btn" onclick="selectPart('背中')">
                背中
            </button>

            <button class="part-btn" onclick="selectPart('肩')">
                肩
            </button>

            <button class="part-btn" onclick="selectPart('腕')">
                腕
            </button>

            <button class="part-btn" onclick="selectPart('脚')">
                脚
            </button>

        </div>

        <div class="date-box">

            <label>トレーニング日</label>

            <input
                type="date"
                id="trainingDate"
            >

        </div>

    </div>


    <div class="card">

        <h2>② 種目を追加</h2>

        <p style="color:#888;font-size:13px;">
            新しい種目は自分で入力。過去に使った種目は選択できます。
        </p>

        <select id="exerciseSelect">
            <option value="">過去の種目から選択</option>
        </select>

        <input
            id="newExercise"
            placeholder="新しい種目名を入力"
            style="margin-top:10px;"
        >

        <button
            class="secondary-button"
            onclick="addExercise()"
        >
            ＋ この種目を追加
        </button>

    </div>


    <div id="exerciseList"></div>


    <div class="total-box">

        <div>
            <div class="total-label">
                今日の総重量
            </div>

            <div class="total-number" id="totalWeight">
                0 kg
            </div>
        </div>

        <div style="font-size:30px;">
            🏋️
        </div>

    </div>


    <button
        class="main-button"
        onclick="saveWorkout()"
    >
        この日のトレーニングを保存
    </button>

</section>



<!-- =========================
     履歴ページ
========================= -->

<section id="historyPage" class="page">

    <h1>トレーニング履歴</h1>

    <div class="stat-grid">

        <div class="stat">
            <div class="stat-label">
                トレーニング回数
            </div>

            <div class="stat-value" id="totalSessions">
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                総挙上重量
            </div>

            <div class="stat-value" id="allTimeWeight">
                0kg
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                最重量
            </div>

            <div class="stat-value" id="maxWeight">
                0kg
            </div>
        </div>

    </div>


    <div class="card">

        <h2>総重量の推移</h2>

        <div class="chart-container">
            <canvas id="weightChart"></canvas>
        </div>

    </div>


    <div class="card">

        <h2>部位別</h2>

        <select id="historyFilter" onchange="renderHistory()">

            <option value="すべて">
                すべて
            </option>

            <option value="胸">
                胸
            </option>

            <option value="背中">
                背中
            </option>

            <option value="肩">
                肩
            </option>

            <option value="腕">
                腕
            </option>

            <option value="脚">
                脚
            </option>

        </select>

    </div>


    <div id="historyList"></div>

</section>

</main>


<!-- =========================
     編集モーダル
========================= -->

<div class="modal" id="editModal">

    <div class="modal-content">

        <button
            class="close-modal"
            onclick="closeEditModal()"
        >
            ✕
        </button>

        <h2>記録を編集</h2>

        <div id="editContent"></div>

        <button
            class="main-button"
            onclick="saveEditedWorkout()"
        >
            変更を保存
        </button>

    </div>

</div>


<script>

/* =====================================
   データ
===================================== */

let workouts =
    JSON.parse(localStorage.getItem("workouts")) || [];

let exerciseMaster =
    JSON.parse(localStorage.getItem("exerciseMaster")) || {};

let currentPart = "胸";

let currentExercises = [];

let editingWorkoutId = null;


/* =====================================
   初期設定
===================================== */

document.getElementById("trainingDate").value =
    new Date().toISOString().split("T")[0];

updateExerciseSelect();

renderHistory();


/* =====================================
   ページ切り替え
===================================== */

function showPage(page) {

    document
        .querySelectorAll(".page")
        .forEach(el => el.classList.remove("active"));

    document
        .querySelectorAll(".nav button")
        .forEach(el => el.classList.remove("active"));

    if (page === "record") {

        document
            .getElementById("recordPage")
            .classList.add("active");

        document
            .getElementById("recordNav")
            .classList.add("active");

    } else {

        document
            .getElementById("historyPage")
            .classList.add("active");

        document
            .getElementById("historyNav")
            .classList.add("active");

        renderHistory();
    }
}


/* =====================================
   部位選択
===================================== */

function selectPart(part) {

    currentPart = part;

    document
        .querySelectorAll(".part-btn")
        .forEach(btn => {

            btn.classList.remove("active");

            if (btn.textContent.trim() === part) {
                btn.classList.add("active");
            }

        });

    currentExercises = [];

    renderExercises();

    updateExerciseSelect();
}


/* =====================================
   種目一覧更新
===================================== */

function updateExerciseSelect() {

    const select =
        document.getElementById("exerciseSelect");

    select.innerHTML =
        '<option value="">過去の種目から選択</option>';

    const list =
        exerciseMaster[currentPart] || [];

    list.forEach(name => {

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        select.appendChild(option);

    });
}


/* =====================================
   種目追加
===================================== */

function addExercise() {

    const select =
        document.getElementById("exerciseSelect");

    const newInput =
        document.getElementById("newExercise");

    let name =
        newInput.value.trim() || select.value;

    if (!name) {

        alert("種目を入力または選択してください。");

        return;
    }

    currentExercises.push({

        id: Date.now() + Math.random(),

        name: name,

        sets: [
            {
                weight: "",
                reps: ""
            }
        ]

    });


    if (!exerciseMaster[currentPart]) {

        exerciseMaster[currentPart] = [];

    }


    if (!exerciseMaster[currentPart].includes(name)) {

        exerciseMaster[currentPart].push(name);

        localStorage.setItem(
            "exerciseMaster",
            JSON.stringify(exerciseMaster)
        );

    }


    newInput.value = "";

    select.value = "";

    renderExercises();

    updateTotalWeight();

}


/* =====================================
   種目表示
===================================== */

function renderExercises() {

    const container =
        document.getElementById("exerciseList");

    container.innerHTML = "";


    if (currentExercises.length === 0) {

        container.innerHTML = `
            <div class="empty">
                まだ種目が追加されていません。
            </div>
        `;

        updateTotalWeight();

        return;
    }


    currentExercises.forEach((exercise, exerciseIndex) => {

        const card =
            document.createElement("div");

        card.className = "exercise-card";


        const previous =
            getPreviousExercise(
                exercise.name
            );


        let previousHTML = "";

        if (previous) {

            const previousTotal =
                calculateWorkoutExerciseTotal(
                    previous
                );

            previousHTML = `
                <div class="previous">
                    前回：<strong>${previous.date}</strong><br>
                    最大重量：<strong>${getMaxWeight(previous)} kg</strong><br>
                    総重量：<strong>${previousTotal.toLocaleString()} kg</strong>
                </div>
            `;

        } else {

            previousHTML = `
                <div class="previous">
                    この種目の前回記録はありません。
                </div>
            `;

        }


        card.innerHTML = `

            <div class="exercise-header">

                <div class="exercise-title">
                    ${escapeHTML(exercise.name)}
                </div>

                <button
                    class="delete-exercise"
                    onclick="removeExercise(${exerciseIndex})"
                >
                    削除
                </button>

            </div>

            ${previousHTML}

            <div class="sets">

                ${exercise.sets.map((set, setIndex) => `

                    <div class="set-row">

                        <div class="set-number">
                            ${setIndex + 1}
                        </div>

                        <input
                            type="number"
                            min="0"
                            step="0.5"
                            placeholder="重量 kg"
                            value="${set.weight}"
                            onchange="updateSet(${exerciseIndex}, ${setIndex}, 'weight', this.value)"
                        >

                        <input
                            type="number"
                            min="0"
                            placeholder="REP"
                            value="${set.reps}"
                            onchange="updateSet(${exerciseIndex}, ${setIndex}, 'reps', this.value)"
                        >

                        <button
                            class="remove-set"
                            onclick="removeSet(${exerciseIndex}, ${setIndex})"
                        >
                            ×
                        </button>

                    </div>

                `).join("")}

            </div>

            <button
                class="add-set"
                onclick="addSet(${exerciseIndex})"
            >
                ＋ セット追加
            </button>

        `;

        container.appendChild(card);

    });


    updateTotalWeight();
}


/* =====================================
   セット操作
===================================== */

function addSet(exerciseIndex) {

    currentExercises[exerciseIndex].sets.push({

        weight: "",
        reps: ""

    });

    renderExercises();
}


function removeSet(exerciseIndex, setIndex) {

    if (
        currentExercises[exerciseIndex]
            .sets.length <= 1
    ) {

        return;

    }

    currentExercises[exerciseIndex]
        .sets.splice(setIndex, 1);

    renderExercises();
}


function updateSet(
    exerciseIndex,
    setIndex,
    key,
    value
) {

    currentExercises[exerciseIndex]
        .sets[setIndex][key] =
        value;

    updateTotalWeight();
}


function removeExercise(index) {

    currentExercises.splice(index, 1);

    renderExercises();
}


/* =====================================
   総重量計算
===================================== */

function calculateExerciseTotal(exercise) {

    return exercise.sets.reduce(
        (total, set) => {

            const weight =
                parseFloat(set.weight) || 0;

            const reps =
                parseFloat(set.reps) || 0;

            return total + weight * reps;

        },
        0
    );
}


function calculateWorkoutTotal(workout) {

    return workout.exercises.reduce(
        (total, exercise) => {

            return total +
                calculateExerciseTotal(exercise);

        },
        0
    );
}


function calculateWorkoutExerciseTotal(exercise) {

    return calculateExerciseTotal(exercise);
}


function updateTotalWeight() {

    const total =
        currentExercises.reduce(
            (sum, exercise) =>
                sum + calculateExerciseTotal(exercise),
            0
        );

    document.getElementById(
        "totalWeight"
    ).textContent =
        total.toLocaleString() + " kg";
}


/* =====================================
   前回記録
===================================== */

function getPreviousExercise(name) {

    const previousWorkouts =
        workouts
        .filter(workout =>
            workout.part === currentPart
        )
        .sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );


    for (const workout of previousWorkouts) {

        const found =
            workout.exercises.find(
                exercise =>
                    exercise.name === name
            );

        if (found) {

            return {
                ...found,
                date: workout.date
            };

        }

    }

    return null;
}


function getMaxWeight(exercise) {

    return Math.max(
        ...exercise.sets.map(
            set =>
                parseFloat(set.weight) || 0
        ),
        0
    );
}


/* =====================================
   保存
===================================== */

function saveWorkout() {

    if (currentExercises.length === 0) {

        alert("種目を1つ以上追加してください。");

        return;
    }


    const date =
        document.getElementById(
            "trainingDate"
        ).value;


    if (!date) {

        alert("トレーニング日を入力してください。");

        return;
    }


    const workout = {

        id: Date.now(),

        date: date,

        part: currentPart,

        exercises:
            JSON.parse(
                JSON.stringify(currentExercises)
            )

    };


    workouts.push(workout);


    workouts.sort(
        (a, b) =>
            new Date(b.date) -
            new Date(a.date)
    );


    localStorage.setItem(
        "workouts",
        JSON.stringify(workouts)
    );


    alert("トレーニングを保存しました！");


    currentExercises = [];

    renderExercises();

    renderHistory();

}


/* =====================================
   履歴表示
===================================== */

function renderHistory() {

    const container =
        document.getElementById("historyList");

    const filter =
        document.getElementById(
            "historyFilter"
        )?.value || "すべて";


    let filtered =
        [...workouts]
        .filter(workout =>
            filter === "すべて" ||
            workout.part === filter
        )
        .sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );


    updateStats();


    container.innerHTML = "";


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                まだトレーニング記録がありません。
            </div>
        `;

        drawChart();

        return;
    }


    filtered.forEach(workout => {

        const item =
            document.createElement("div");

        item.className = "history-item";


        const total =
            calculateWorkoutTotal(workout);


        item.innerHTML = `

            <div class="history-top">

                <div class="history-date">
                    ${workout.date}
                </div>

                <div class="part-tag">
                    ${workout.part}
                </div>

            </div>


            <div class="exercise-summary">

                ${workout.exercises.map(exercise => `

                    <div>
                        <strong>
                            ${escapeHTML(exercise.name)}
                        </strong>

                        <br>

                        ${exercise.sets.map(set => {

                            const weight =
                                set.weight || "-";

                            const reps =
                                set.reps || "-";

                            return `${weight}kg × ${reps}rep`;

                        }).join(" / ")}

                    </div>

                `).join("")}

            </div>


            <div class="history-total">
                総重量：
                ${total.toLocaleString()} kg
            </div>


            <div class="history-buttons">

                <button
                    class="edit-btn"
                    onclick="openEditModal(${workout.id})"
                >
                    編集
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteWorkout(${workout.id})"
                >
                    削除
                </button>

            </div>

        `;


        container.appendChild(item);

    });


    drawChart();

}


/* =====================================
   統計
===================================== */

function updateStats() {

    document.getElementById(
        "totalSessions"
    ).textContent =
        workouts.length;


    const allWeight =
        workouts.reduce(
            (sum, workout) =>
                sum + calculateWorkoutTotal(workout),
            0
        );


    document.getElementById(
        "allTimeWeight"
    ).textContent =
        Math.round(allWeight).toLocaleString()
        + "kg";


    let max = 0;


    workouts.forEach(workout => {

        workout.exercises.forEach(exercise => {

            max =
                Math.max(
                    max,
                    getMaxWeight(exercise)
                );

        });

    });


    document.getElementById(
        "maxWeight"
    ).textContent =
        max + "kg";

}


/* =====================================
   編集
===================================== */

function openEditModal(id) {

    const workout =
        workouts.find(
            workout =>
                workout.id === id
        );


    if (!workout) return;


    editingWorkoutId = id;


    const content =
        document.getElementById(
            "editContent"
        );


    content.innerHTML = `

        <label>日付</label>

        <input
            type="date"
            id="editDate"
            value="${workout.date}"
        >


        <div style="margin-top:20px;">

            <label>部位</label>

            <select id="editPart">

                ${[
                    "胸",
                    "背中",
                    "肩",
                    "腕",
                    "脚"
                ].map(part => `

                    <option
                        value="${part}"
                        ${workout.part === part ? "selected" : ""}
                    >
                        ${part}
                    </option>

                `).join("")}

            </select>

        </div>


        <div id="editExercises">

            ${workout.exercises.map(
                (exercise, exerciseIndex) => `

                <div class="exercise-card">

                    <input
                        value="${escapeHTML(exercise.name)}"
                        id="editName${exerciseIndex}"
                    >

                    <div>

                        ${exercise.sets.map(
                            (set, setIndex) => `

                            <div class="set-row">

                                <div class="set-number">
                                    ${setIndex + 1}
                                </div>

                                <input
                                    type="number"
                                    id="editWeight${exerciseIndex}_${setIndex}"
                                    value="${set.weight}"
                                    placeholder="重量 kg"
                                >

                                <input
                                    type="number"
                                    id="editReps${exerciseIndex}_${setIndex}"
                                    value="${set.reps}"
                                    placeholder="REP"
                                >

                            </div>

                        `).join("")}

                    </div>

                </div>

            `
            ).join("")}

        </div>

    `;


    document
        .getElementById("editModal")
        .classList.add("active");

}


function closeEditModal() {

    document
        .getElementById("editModal")
        .classList.remove("active");

    editingWorkoutId = null;

}


function saveEditedWorkout() {

    const index =
        workouts.findIndex(
            workout =>
                workout.id ===
                editingWorkoutId
        );


    if (index === -1) return;


    const workout =
        workouts[index];


    workout.date =
        document.getElementById(
            "editDate"
        ).value;


    workout.part =
        document.getElementById(
            "editPart"
        ).value;


    workout.exercises.forEach(
        (exercise, exerciseIndex) => {

            exercise.name =
                document.getElementById(
                    `editName${exerciseIndex}`
                ).value;


            exercise.sets.forEach(
                (set, setIndex) => {

                    set.weight =
                        document.getElementById(
                            `editWeight${exerciseIndex}_${setIndex}`
                        ).value;


                    set.reps =
                        document.getElementById(
                            `editReps${exerciseIndex}_${setIndex}`
                        ).value;

                }
            );

        }
    );


    localStorage.setItem(
        "workouts",
        JSON.stringify(workouts)
    );


    closeEditModal();

    renderHistory();

    alert("記録を変更しました。");

}


/* =====================================
   削除
===================================== */

function deleteWorkout(id) {

    const result =
        confirm(
            "このトレーニング記録を削除しますか？"
        );


    if (!result) return;


    workouts =
        workouts.filter(
            workout =>
                workout.id !== id
        );


    localStorage.setItem(
        "workouts",
        JSON.stringify(workouts)
    );


    renderHistory();

}


/* =====================================
   グラフ
===================================== */

function drawChart() {

    const canvas =
        document.getElementById(
            "weightChart"
        );


    if (!canvas) return;


    const ctx =
        canvas.getContext("2d");


    const rect =
        canvas.parentElement.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;


    canvas.height =
        280 * dpr;


    canvas.style.width =
        rect.width + "px";


    canvas.style.height =
        "280px";


    ctx.scale(dpr, dpr);


    const width =
        rect.width;


    const height =
        280;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const data =
        [...workouts]
        .sort(
            (a, b) =>
                new Date(a.date) -
                new Date(b.date)
        );


    if (data.length === 0) {

        ctx.fillStyle = "#777";

        ctx.font = "14px sans-serif";

        ctx.textAlign = "center";

        ctx.fillText(
            "まだデータがありません",
            width / 2,
            height / 2
        );

        return;
    }


    const values =
        data.map(
            workout =>
                calculateWorkoutTotal(workout)
        );


    const max =
        Math.max(...values, 100);


    const padding = 45;


    /* グリッド */

    ctx.strokeStyle = "#2d2d31";

    ctx.lineWidth = 1;


    for (let i = 0; i <= 4; i++) {

        const y =
            padding +
            ((height - padding * 2) / 4) * i;


        ctx.beginPath();

        ctx.moveTo(
            padding,
            y
        );

        ctx.lineTo(
            width - padding,
            y
        );

        ctx.stroke();


        const value =
            Math.round(
                max -
                (max / 4) * i
            );


        ctx.fillStyle = "#777";

        ctx.font = "11px sans-serif";

        ctx.textAlign = "right";

        ctx.fillText(
            value + "kg",
            padding - 7,
            y + 4
        );

    }


    /* 線 */

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 3;

    ctx.beginPath();


    data.forEach(
        (workout, index) => {

            const x =
                data.length === 1
                ? width / 2
                : padding +
                  ((width - padding * 2) /
                  (data.length - 1)) *
                  index;


            const y =
                height -
                padding -
                (
                    values[index] /
                    max
                ) *
                (height - padding * 2);


            if (index === 0) {

                ctx.moveTo(x, y);

            } else {

                ctx.lineTo(x, y);

            }

        }
    );


    ctx.stroke();


    /* 点 */

    data.forEach(
        (workout, index) => {

            const x =
                data.length === 1
                ? width / 2
                : padding +
                  ((width - padding * 2) /
                  (data.length - 1)) *
                  index;


            const y =
                height -
                padding -
                (
                    values[index] /
                    max
                ) *
                (height - padding * 2);


            ctx.fillStyle = "#ffffff";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle = "#aaa";

            ctx.font = "10px sans-serif";

            ctx.textAlign = "center";

            ctx.fillText(
                workout.date.slice(5),
                x,
                height - 12
            );

        }
    );

}


/* =====================================
   HTMLエスケープ
===================================== */

function escapeHTML(str) {

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================
   画面サイズ変更時
===================================== */

window.addEventListener(
    "resize",
    drawChart
);

</script>
